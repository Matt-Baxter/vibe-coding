<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Movie Picker</title>
<style>
  :root {
    --bg: #14121c;
    --panel: #1f1c2b;
    --panel-2: #2a2639;
    --text: #ece9f5;
    --muted: #a49fb8;
    --accent: #f5c518; /* IMDb yellow */
    --accent-2: #8b7cf6;
    --good: #5bd68a;
    --ok: #f5c518;
    --meh: #a49fb8;
    --radius: 12px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(circle at 20% 0%, #2b2145 0%, var(--bg) 55%);
    background-attachment: fixed;
    color: var(--text);
    line-height: 1.4;
  }
  header { padding: 28px 24px 8px; max-width: 1100px; margin: 0 auto; }
  h1 { margin: 0; font-size: 2rem; letter-spacing: .5px; }
  h1 span { color: var(--accent); }
  header p { margin: 6px 0 0; color: var(--muted); }
  main { max-width: 1100px; margin: 0 auto; padding: 16px 24px 40px; }

  .filters {
    background: var(--panel);
    border-radius: var(--radius);
    padding: 18px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
    gap: 18px 24px;
    box-shadow: 0 8px 30px rgba(0,0,0,.35);
  }
  fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }
  legend, .label { font-weight: 600; font-size: .9rem; margin-bottom: 8px; display: block; padding: 0; }
  .hint { color: var(--muted); font-weight: 400; font-size: .8rem; }
  .genres { grid-column: 1 / -1; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    border: 1px solid #3d3854; background: var(--panel-2); color: var(--text);
    border-radius: 999px; padding: 5px 12px; font-size: .85rem; cursor: pointer;
    transition: background .15s, border-color .15s, color .15s;
  }
  .chip:hover { border-color: var(--accent-2); }
  .chip[aria-pressed="true"] { background: var(--accent-2); border-color: var(--accent-2); color: #fff; }
  .genre-mode { margin-top: 8px; font-size: .85rem; color: var(--muted); display: flex; gap: 14px; flex-wrap: wrap; }
  .range { display: flex; align-items: center; gap: 8px; }
  input[type=number], select {
    width: 100%; background: var(--panel-2); color: var(--text);
    border: 1px solid #3d3854; border-radius: 8px; padding: 7px 9px; font-size: .95rem;
  }
  input[type=number]:focus, select:focus, .chip:focus-visible, button:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 1px;
  }
  .presets { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
  .presets button, .actions button {
    background: var(--panel-2); color: var(--text); border: 1px solid #3d3854;
    border-radius: 8px; padding: 4px 10px; font-size: .8rem; cursor: pointer;
  }
  .presets button:hover { border-color: var(--accent); }
  .actions { grid-column: 1 / -1; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .actions button { font-size: .95rem; padding: 8px 16px; }
  .actions .primary { background: var(--accent); color: #111; border-color: var(--accent); font-weight: 700; }
  .actions .primary:hover { filter: brightness(1.08); }

  .summary { margin: 22px 0 10px; color: var(--muted); display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
  .summary strong { color: var(--text); }

  .pick {
    display: none; margin: 0 0 14px; padding: 14px 18px; border-radius: var(--radius);
    background: linear-gradient(90deg, rgba(245,197,24,.18), rgba(139,124,246,.18));
    border: 1px solid rgba(245,197,24,.5);
  }
  .pick.show { display: block; }
  .pick a { color: var(--accent); font-weight: 700; font-size: 1.15rem; }

  /* overflow: clip keeps the rounded corners without creating a scroll box,
     so the sticky header pins to the page. Narrow screens scroll sideways instead. */
  .table-wrap { overflow: clip; border-radius: var(--radius); background: var(--panel); }
  @media (max-width: 700px) { .table-wrap { overflow-x: auto; } }
  table { width: 100%; border-collapse: collapse; font-size: .95rem; }
  th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid #2f2b40; }
  th { background: var(--panel-2); position: sticky; top: 0; font-size: .85rem; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); }
  th button { all: unset; cursor: pointer; }
  th button:hover { color: var(--text); }
  th .arrow { color: var(--accent); }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  td.idx { color: var(--muted); width: 1%; white-space: nowrap; }
  td.title a { color: var(--text); text-decoration: none; font-weight: 600; }
  td.title a:hover { color: var(--accent); text-decoration: underline; }
  td.genre { color: var(--muted); font-size: .88rem; }
  td.len { white-space: nowrap; }
  tbody tr:hover { background: rgba(255,255,255,.03); }
  tbody tr.highlight { background: rgba(245,197,24,.15); }
  .score { font-weight: 700; }
  .score.good { color: var(--good); }
  .score.ok { color: var(--ok); }
  .score.meh { color: var(--meh); }
  .empty { padding: 30px; text-align: center; color: var(--muted); }
  .more { display: block; margin: 14px auto 0; }

  footer { max-width: 1100px; margin: 0 auto; padding: 0 24px 30px; color: var(--muted); font-size: .8rem; }
  footer a { color: var(--muted); }
  .error { background: #4a1f2a; border: 1px solid #a33; padding: 16px; border-radius: var(--radius); }
</style>
</head>
<body>
<header>
  <h1>🎬 Movie <span>Picker</span></h1>
  <p>Set a few filters, get a list of movies worth watching.</p>
</header>

<main>
  <form class="filters" id="filters" autocomplete="off">
    <fieldset class="genres">
      <legend>Genre <span class="hint">(none selected = any genre)</span></legend>
      <div class="chips" id="genreChips"></div>
      <div class="genre-mode">
        <label><input type="radio" name="genreMode" value="any" checked> Match <b>any</b> selected genre</label>
        <label><input type="radio" name="genreMode" value="all"> Match <b>all</b> selected genres</label>
      </div>
    </fieldset>

    <fieldset>
      <legend>Length <span class="hint">(minutes)</span></legend>
      <div class="range">
        <input type="number" id="lenMin" min="0" step="5" placeholder="min">
        <span>to</span>
        <input type="number" id="lenMax" min="0" step="5" placeholder="max">
      </div>
      <div class="presets" data-target="len">
        <button type="button" data-min="" data-max="100">Short (&le;100)</button>
        <button type="button" data-min="" data-max="130">&le;2h10</button>
        <button type="button" data-min="150" data-max="">Epic (150+)</button>
      </div>
    </fieldset>

    <fieldset>
      <legend>Minimum IMDb rating</legend>
      <input type="number" id="minRating" min="0" max="10" step="0.1" value="7">
      <div class="presets" data-target="rating">
        <button type="button" data-val="7">7+ decent</button>
        <button type="button" data-val="8">8+ good</button>
        <button type="button" data-val="">any</button>
      </div>
    </fieldset>

    <fieldset>
      <legend>Year released</legend>
      <div class="range">
        <input type="number" id="yearMin" step="1" placeholder="from">
        <span>to</span>
        <input type="number" id="yearMax" step="1" placeholder="to">
      </div>
      <div class="presets" data-target="year">
        <button type="button" data-min="2015" data-max="">Since 2015</button>
        <button type="button" data-min="1990" data-max="2014">1990&ndash;2014</button>
        <button type="button" data-min="" data-max="1989">Before 1990</button>
      </div>
    </fieldset>

    <fieldset>
      <legend>Minimum IMDb votes <span class="hint" id="votesHint"></span></legend>
      <select id="minVotes"></select>
    </fieldset>

    <div class="actions">
      <button type="button" class="primary" id="surprise">🎲 Pick one for me</button>
      <button type="button" id="reset">Reset filters</button>
    </div>
  </form>

  <div class="summary">
    <span id="count"></span>
    <span id="sortInfo"></span>
  </div>

  <div class="pick" id="pick" aria-live="polite"></div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th class="num">#</th>
          <th><button type="button" data-sort="title">Movie Title <span class="arrow"></span></button></th>
          <th>Genre</th>
          <th class="num"><button type="button" data-sort="runtime">Length <span class="arrow"></span></button></th>
          <th class="num"><button type="button" data-sort="year">Year <span class="arrow"></span></button></th>
          <th class="num"><button type="button" data-sort="rating">IMDb Score <span class="arrow"></span></button></th>
        </tr>
      </thead>
      <tbody id="results"></tbody>
    </table>
  </div>
  <button type="button" class="more" id="more" hidden>Show more</button>
</main>

<footer id="footer"></footer>

<script src="movies-data.js"></script>
<script>
(() => {
  const PAGE = 100;
  const VOTE_STEPS = [5000, 10000, 25000, 50000, 100000, 250000, 500000];
  const DEFAULT_VOTES = 10000;
  const DEFAULT_RATING = 7;

  const $ = id => document.getElementById(id);

  if (!window.MOVIE_DATA) {
    document.querySelector('main').innerHTML =
      '<div class="error"><b>Movie data not found.</b> Keep <code>movies-data.js</code> in the same folder as this page, ' +
      'or run <code>python3 build_data.py</code> to create it.</div>';
    return;
  }

  const D = window.MOVIE_DATA;
  const GENRES = D.genres;
  // Expand compact rows into objects once.
  const MOVIES = D.movies.map(([title, year, runtime, mask, rating, votes, id]) => ({
    title, year, runtime, mask, rating, votes,
    url: 'https://www.imdb.com/title/tt' + String(id).padStart(7, '0') + '/',
    genreText: GENRES.filter((_, i) => mask & (1 << i)).join(', ')
  }));

  // ---- Build controls ----
  const chips = $('genreChips');
  GENRES.forEach((g, i) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'chip';
    b.textContent = g;
    b.dataset.bit = i;
    b.setAttribute('aria-pressed', 'false');
    b.addEventListener('click', () => {
      b.setAttribute('aria-pressed', b.getAttribute('aria-pressed') === 'true' ? 'false' : 'true');
      update();
    });
    chips.appendChild(b);
  });

  const votesSel = $('minVotes');
  VOTE_STEPS.filter(v => v >= D.minVotes).forEach(v => {
    const o = document.createElement('option');
    o.value = v;
    o.textContent = v.toLocaleString() + '+';
    votesSel.appendChild(o);
  });
  votesSel.value = DEFAULT_VOTES;
  $('votesHint').textContent = '(hides obscure titles)';

  const years = MOVIES.map(m => m.year);
  const minYear = Math.min(...years), maxYear = Math.max(...years);
  $('yearMin').placeholder = minYear;
  $('yearMax').placeholder = maxYear;

  document.querySelectorAll('.presets').forEach(group => {
    group.addEventListener('click', e => {
      const b = e.target.closest('button');
      if (!b) return;
      const t = group.dataset.target;
      if (t === 'rating') $('minRating').value = b.dataset.val;
      if (t === 'len') { $('lenMin').value = b.dataset.min; $('lenMax').value = b.dataset.max; }
      if (t === 'year') { $('yearMin').value = b.dataset.min; $('yearMax').value = b.dataset.max; }
      update();
    });
  });

  $('filters').addEventListener('input', update);
  $('filters').addEventListener('submit', e => e.preventDefault());

  $('reset').addEventListener('click', () => {
    chips.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', 'false'));
    document.querySelector('input[name=genreMode][value=any]').checked = true;
    ['lenMin', 'lenMax', 'yearMin', 'yearMax'].forEach(id => $(id).value = '');
    $('minRating').value = DEFAULT_RATING;
    votesSel.value = DEFAULT_VOTES;
    sort = { key: 'rating', dir: -1 };
    update();
  });

  // ---- Sorting ----
  let sort = { key: 'rating', dir: -1 };
  const DEFAULT_DIR = { rating: -1, year: -1, title: 1, runtime: 1 };
  document.querySelectorAll('th button[data-sort]').forEach(b => {
    b.addEventListener('click', () => {
      const k = b.dataset.sort;
      sort = sort.key === k ? { key: k, dir: -sort.dir } : { key: k, dir: DEFAULT_DIR[k] };
      update();
    });
  });

  function compare(a, b) {
    const k = sort.key;
    // Unknown lengths (0) always go to the bottom when sorting by length.
    if (k === 'runtime' && !a.runtime !== !b.runtime) return a.runtime ? -1 : 1;
    const c = k === 'title' ? a.title.localeCompare(b.title) : a[k] - b[k];
    return c !== 0 ? c * sort.dir : b.votes - a.votes; // tie-break: more popular first
  }

  // ---- Filtering ----
  const num = id => { const v = $(id).value.trim(); return v === '' ? null : Number(v); };

  let current = [];
  let shown = 0;

  function update() {
    const selected = [...chips.querySelectorAll('.chip[aria-pressed=true]')]
      .reduce((m, c) => m | (1 << Number(c.dataset.bit)), 0);
    const mode = document.querySelector('input[name=genreMode]:checked').value;
    const lenMin = num('lenMin'), lenMax = num('lenMax');
    const yMin = num('yearMin'), yMax = num('yearMax');
    const rMin = num('minRating');
    const vMin = Number(votesSel.value);

    current = MOVIES.filter(m => {
      if (m.votes < vMin) return false;
      if (rMin !== null && m.rating < rMin) return false;
      if (yMin !== null && m.year < yMin) return false;
      if (yMax !== null && m.year > yMax) return false;
      if (lenMin !== null || lenMax !== null) {
        if (!m.runtime) return false; // unknown length can't satisfy a length filter
        if (lenMin !== null && m.runtime < lenMin) return false;
        if (lenMax !== null && m.runtime > lenMax) return false;
      }
      if (selected) {
        if (mode === 'any' && !(m.mask & selected)) return false;
        if (mode === 'all' && (m.mask & selected) !== selected) return false;
      }
      return true;
    });
    current.sort(compare);

    shown = 0;
    $('results').innerHTML = '';
    $('pick').classList.remove('show');
    renderMore();

    $('count').innerHTML = `<strong>${current.length.toLocaleString()}</strong> movie${current.length === 1 ? '' : 's'} match`;
    const names = { rating: 'IMDb score', year: 'year', title: 'title', runtime: 'length' };
    const dirWord = sort.key === 'title' ? (sort.dir > 0 ? 'A→Z' : 'Z→A') : sort.key === 'runtime' ? (sort.dir > 0 ? 'shortest first' : 'longest first') : (sort.dir > 0 ? 'low→high' : 'high→low');
    $('sortInfo').textContent = `Sorted by ${names[sort.key]} (${dirWord}) · click a column header to change`;
    document.querySelectorAll('th button[data-sort]').forEach(b => {
      b.querySelector('.arrow').textContent = b.dataset.sort === sort.key ? (sort.dir > 0 ? '▲' : '▼') : '';
    });
  }

  // 125 -> "2 hr 5 min", 45 -> "45 min", 0 (unknown) -> "—"
  function fmtLength(mins) {
    if (!mins) return '—';
    const h = Math.floor(mins / 60), m = mins % 60;
    return h ? `${h} hr ${m} min` : `${m} min`;
  }

  function scoreClass(r) { return r >= 8 ? 'good' : r >= 7 ? 'ok' : 'meh'; }

  function rowHtml(m, i) {
    const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    return `<tr data-i="${i}">
      <td class="num idx">${i + 1}</td>
      <td class="title"><a href="${m.url}" target="_blank" rel="noopener" title="${m.votes.toLocaleString()} IMDb votes">${esc(m.title)}</a></td>
      <td class="genre">${esc(m.genreText)}</td>
      <td class="num len">${fmtLength(m.runtime)}</td>
      <td class="num">${m.year}</td>
      <td class="num"><span class="score ${scoreClass(m.rating)}">${m.rating.toFixed(1)}</span></td>
    </tr>`;
  }

  function renderMore() {
    const tbody = $('results');
    if (!current.length) {
      tbody.innerHTML = '<tr><td colspan="6" class="empty">No movies match. Try loosening a filter.</td></tr>';
      $('more').hidden = true;
      return;
    }
    const next = current.slice(shown, shown + PAGE);
    tbody.insertAdjacentHTML('beforeend', next.map((m, j) => rowHtml(m, shown + j)).join(''));
    shown += next.length;
    $('more').hidden = shown >= current.length;
    $('more').textContent = `Show more (${(current.length - shown).toLocaleString()} left)`;
  }
  $('more').addEventListener('click', renderMore);

  // ---- Random pick ----
  $('surprise').addEventListener('click', () => {
    const box = $('pick');
    if (!current.length) {
      box.innerHTML = 'Nothing to pick from. Loosen a filter first.';
      box.classList.add('show');
      return;
    }
    const i = Math.floor(Math.random() * current.length);
    const m = current[i];
    while (shown <= i) renderMore();
    document.querySelectorAll('tbody tr.highlight').forEach(r => r.classList.remove('highlight'));
    const row = document.querySelector(`tbody tr[data-i="${i}"]`);
    row.classList.add('highlight');
    box.innerHTML = `🎲 Tonight: <a href="${m.url}" target="_blank" rel="noopener"></a>
      <span class="hint"> · ${m.year} · ${m.genreText} · ${m.runtime ? fmtLength(m.runtime) + ' · ' : ''}IMDb ${m.rating.toFixed(1)} · row #${i + 1}</span>`;
    box.querySelector('a').textContent = m.title;
    box.classList.add('show');
    box.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  });

  $('footer').innerHTML =
    `${MOVIES.length.toLocaleString()} movies with at least ${D.minVotes.toLocaleString()} IMDb votes, data from ${D.built}. ` +
    `Refresh with <code>python3 build_data.py</code>. ` +
    `Information courtesy of IMDb (<a href="https://www.imdb.com" target="_blank" rel="noopener">imdb.com</a>). Used with permission.`;

  update();
})();
</script>
</body>
</html>
